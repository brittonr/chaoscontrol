name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

env:
  KVM_RECEIPT_RETENTION_DAYS: 14

jobs:
  portable-checks:
    name: Portable checks (no KVM behavior claim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run CI-supported flake checks
        run: |
          nix build \
            .#checks.x86_64-linux.fmt \
            .#checks.x86_64-linux.nixfmt \
            .#checks.x86_64-linux.package \
            .#checks.x86_64-linux.clippy \
            .#checks.x86_64-linux.tests \
            .#checks.x86_64-linux.property-coverage \
            .#checks.x86_64-linux.profiling \
            .#checks.x86_64-linux.rustdoc \
            --no-link -L
      - name: Emit replay readiness receipt
        run: |
          mkdir -p target
          nix build .#checks.x86_64-linux.replay-readiness \
            --out-link target/replay-readiness-check -L
          cat target/replay-readiness-check/replay-readiness-summary.txt
      # r[impl chaoscontrol.property_coverage.ci]
      # r[impl chaoscontrol.state_machine_properties.fast_lane]
      - name: Run bounded fast state-machine properties
        run: |
          nix develop -c cargo run -q -p chaoscontrol-property-suite \
            --bin run-property-lane -- \
            --lane fast \
            --output target/property-coverage/fast-receipt.json
      - name: Upload portable validation receipts
        uses: actions/upload-artifact@v4
        with:
          name: portable-validation-receipts
          path: |
            target/replay-readiness-check/replay-readiness-receipt.json
            target/replay-readiness-check/replay-readiness-summary.txt
            target/replay-readiness-check/replay-readiness-dashboard.html
            target/property-coverage/fast-receipt.json

  # r[impl chaoscontrol.state_machine_properties.deep_lane]
  deep-state-machine-properties:
    name: Scheduled bounded deep state-machine properties
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run bounded deep state-machine properties
        run: |
          nix develop -c cargo run -q -p chaoscontrol-property-suite \
            --bin run-property-lane -- \
            --lane deep \
            --output target/property-coverage/deep-receipt.json
          cmp target/property-coverage/deep-receipt.json \
            dogfood-results/state-machine-property-coverage-20260809/deep-receipt.json
      - name: Upload deep property receipt
        uses: actions/upload-artifact@v4
        with:
          name: deep-state-machine-property-receipt
          path: target/property-coverage/deep-receipt.json

  # r[impl chaoscontrol.kvm_release_rail.ci]
  kvm-release:
    name: Required bounded KVM release matrix
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, chaoscontrol-kvm]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the matrix without KVM execution
        run: |
          nix develop -c cargo run -q -p chaoscontrol-evidence \
            --bin check-kvm-release-matrix -- --root .
          nix develop -c cargo run -q -p chaoscontrol-evidence \
            --bin run-kvm-release-matrix -- \
            --root . \
            --matrix contracts/kvm-release/matrix.json \
            --dry-run
      - name: Run the required KVM matrix
        run: |
          nix develop -c cargo run -q -p chaoscontrol-evidence \
            --bin run-kvm-release-matrix -- \
            --root . \
            --matrix contracts/kvm-release/matrix.json \
            --out target/kvm-release \
            --expected-revision "$GITHUB_SHA"
      - name: Validate the emitted release receipt
        run: |
          nix develop -c cargo run -q -p chaoscontrol-evidence \
            --bin check-kvm-release-matrix -- \
            --root . \
            --receipt target/kvm-release/release-receipt.json \
            --expected-revision "$GITHUB_SHA"
      - name: Upload the bounded KVM release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvm-release-receipt
          retention-days: ${{ env.KVM_RECEIPT_RETENTION_DAYS }}
          if-no-files-found: error
          path: |
            target/kvm-release/release-receipt.json
            target/kvm-release/release-summary.md
            target/kvm-release/*/stdout.log
            target/kvm-release/*/stderr.log
