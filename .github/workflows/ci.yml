name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out local flake siblings
        run: |
          git clone https://github.com/brittonr/tigerstyle-rs.git "$GITHUB_WORKSPACE/../tigerstyle"
          git -C "$GITHUB_WORKSPACE/../tigerstyle" checkout 2197d80a2a4a261e141531927084e66f92935f93
          git clone https://github.com/brittonr/verified-logic.git "$GITHUB_WORKSPACE/../verified-logic"
          git -C "$GITHUB_WORKSPACE/../verified-logic" checkout b332e653e3252922eb66aac6912899272d7c6c07
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check
