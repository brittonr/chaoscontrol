name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run CI-supported flake checks
        run: |
          nix build \
            .#checks.x86_64-linux.fmt \
            .#checks.x86_64-linux.nixfmt \
            .#checks.x86_64-linux.package \
            .#checks.x86_64-linux.clippy \
            .#checks.x86_64-linux.tests \
            .#checks.x86_64-linux.profiling \
            .#checks.x86_64-linux.rustdoc \
            --no-link -L
      - name: Emit replay readiness receipt
        run: |
          mkdir -p target
          nix build .#checks.x86_64-linux.replay-readiness \
            --out-link target/replay-readiness-check -L
          cat target/replay-readiness-check/replay-readiness-summary.txt
      - name: Upload replay readiness receipt and dashboard
        uses: actions/upload-artifact@v4
        with:
          name: replay-readiness-receipt
          path: |
            target/replay-readiness-check/replay-readiness-receipt.json
            target/replay-readiness-check/replay-readiness-summary.txt
            target/replay-readiness-check/replay-readiness-dashboard.html
