[package]
name = "chaoscontrol-dashboard"
version = "0.1.0"
edition = "2021"
description = "Live web dashboard for ChaosControl exploration campaigns"

[[bin]]
name = "chaoscontrol-dashboard"
path = "src/bin/chaoscontrol-dashboard.rs"

[dependencies]
chaoscontrol-explore = { path = "../chaoscontrol-explore", features = ["dashboard"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
