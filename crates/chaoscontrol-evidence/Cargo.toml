[package]
name = "chaoscontrol-evidence"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
blake3 = "1.8"
chaoscontrol-vmm = { path = "../chaoscontrol-vmm" }
chaoscontrol-protocol = { path = "../chaoscontrol-protocol", features = ["std"] }

[[bin]]
name = "check-evidence-contracts"
path = "src/bin/check-evidence-contracts.rs"

[[bin]]
name = "check-replay-proof-coverage"
path = "src/bin/check-replay-proof-coverage.rs"

[[bin]]
name = "materialize-snapshot-chunks"
path = "src/bin/materialize-snapshot-chunks.rs"

[[bin]]
name = "generate-replay-readiness-report"
path = "src/bin/generate-replay-readiness-report.rs"

[[bin]]
name = "generate-assertion-readiness-report"
path = "src/bin/generate-assertion-readiness-report.rs"

[[bin]]
name = "check-assertion-readiness-promotion-gate"
path = "src/bin/check-assertion-readiness-promotion-gate.rs"

[[bin]]
name = "check-dogfood-artifact-sizes"
path = "src/bin/check-dogfood-artifact-sizes.rs"

[[bin]]
name = "check-accepted-dogfood-config"
path = "src/bin/check-accepted-dogfood-config.rs"

[[bin]]
name = "summarize-sdk-local-output"
path = "src/bin/summarize-sdk-local-output.rs"

[[bin]]
name = "check-sdk-local-report-tracks"
path = "src/bin/check-sdk-local-report-tracks.rs"

[[bin]]
name = "check-sdk-assertion-quality"
path = "src/bin/check-sdk-assertion-quality.rs"

[[bin]]
name = "check-readiness-promotion-gate"
path = "src/bin/check-readiness-promotion-gate.rs"

[[bin]]
name = "check-contract-registry"
path = "src/bin/check-contract-registry.rs"

[[bin]]
name = "check-consistency-history"
path = "src/bin/check-consistency-history.rs"

[[bin]]
name = "check-consistency-fixtures"
path = "src/bin/check-consistency-fixtures.rs"

[[bin]]
name = "kernel-bundle-vm-compat-smoke"
path = "src/bin/kernel-bundle-vm-compat-smoke.rs"

[[bin]]
