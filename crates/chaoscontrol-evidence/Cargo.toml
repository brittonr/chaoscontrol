[package]
name = "chaoscontrol-evidence"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[bin]]
name = "check-replay-proof-coverage"
path = "src/bin/check-replay-proof-coverage.rs"

[[bin]]
name = "materialize-snapshot-chunks"
path = "src/bin/materialize-snapshot-chunks.rs"

[[bin]]
name = "generate-replay-readiness-report"
path = "src/bin/generate-replay-readiness-report.rs"

[[bin]]
name = "generate-assertion-readiness-report"
path = "src/bin/generate-assertion-readiness-report.rs"

[[bin]]
name = "check-assertion-readiness-promotion-gate"
path = "src/bin/check-assertion-readiness-promotion-gate.rs"
