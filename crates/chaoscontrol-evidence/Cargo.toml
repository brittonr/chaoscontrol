[package]
name = "chaoscontrol-evidence"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tar = "0.4"
blake3 = "1.8"
bounded-exec = { git = "https://git.onix.computer/z2CpqLFpdP36fZXYUK5ZNWxMibpCo.git", rev = "29dac88ecded94457572db3fdfaaaab95fa91525" }
libc = "0.2"
kvm-ioctls = "0.19"
bounded-tree-cap = { git = "https://seed.radicle.garden/zqhtZvsteJhxCJE96dMAZSZ9y1PX.git", rev = "b0fd0103bc9eed2c1b6d852045959462d105d8f1" }
bounded-tree-core = { git = "https://seed.radicle.garden/zqhtZvsteJhxCJE96dMAZSZ9y1PX.git", rev = "b0fd0103bc9eed2c1b6d852045959462d105d8f1" }
cap-std = "=4.0.2"
chaoscontrol-vmm = { path = "../chaoscontrol-vmm" }
chaoscontrol-protocol = { path = "../chaoscontrol-protocol", features = ["std"] }
chaoscontrol-replay-evidence-core = { path = "../chaoscontrol-replay-evidence-core" }
chaoscontrol-snapshot-descriptor = { path = "../chaoscontrol-snapshot-descriptor" }
chaoscontrol-sim-core = { path = "../chaoscontrol-sim-core" }
chaoscontrol-smr = { path = "../chaoscontrol-smr" }

[[bin]]
name = "check-evidence-contracts"
path = "src/bin/check-evidence-contracts.rs"

[[bin]]
name = "check-sim-core-purity"
path = "src/bin/check-sim-core-purity.rs"

[[bin]]
name = "check-profile-projections"
path = "src/bin/check-profile-projections.rs"

[[bin]]
