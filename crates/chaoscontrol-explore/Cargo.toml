[package]
name = "chaoscontrol-explore"
version = "0.1.0"
edition = "2021"
description = "Coverage-guided exploration engine for ChaosControl"
license = "AGPL-3.0-or-later"

[[bin]]
name = "chaoscontrol-explore"
path = "src/bin/chaoscontrol-explore.rs"

[[bin]]
name = "check-profile-admission"
path = "src/bin/check-profile-admission.rs"

[features]
default = []
dashboard = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:async-stream", "dep:futures-core"]
profiling = ["dep:tracing", "chaoscontrol-vmm/profiling"]

[dependencies]
campaign-core = { git = "https://git.onix.computer/z2scC9MCm3pxk9mX4FEidRKabQ5LN.git", rev = "e23e3edf1dc6a8c612a4ea33a3b805bda1173e3b" }
campaign-choregraph = { git = "https://git.onix.computer/z2scC9MCm3pxk9mX4FEidRKabQ5LN.git", rev = "e23e3edf1dc6a8c612a4ea33a3b805bda1173e3b" }
choregraph-history = { git = "https://git.onix.computer/zL2ncTUeASVYwcoGkEXv9JKgGbAF.git", rev = "b3e08e19750f53bdbcae970cdf58a47a791ed20b" }
chaoscontrol-vmm = { path = "../chaoscontrol-vmm" }
chaoscontrol-fault = { path = "../chaoscontrol-fault" }
chaoscontrol-protocol = { path = "../chaoscontrol-protocol", features = ["std"] }
chaoscontrol-evidence = { path = "../chaoscontrol-evidence" }
chaoscontrol-replay-evidence-core = { path = "../chaoscontrol-replay-evidence-core" }
blake3 = "1.8"
log = "0.4"
snafu = "0.8"
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
vm-memory = { version = "0.17", features = ["backend-mmap"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ciborium = "0.2"
zstd = "0.13"
sha2 = "0.10"
libc = "0.2"
tracing = { version = "0.1", optional = true }

# Dashboard feature deps (optional)
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
async-stream = { version = "0.3", optional = true }
futures-core = { version = "0.3", optional = true }
