[package]
name = "chaoscontrol-property-suite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
chaoscontrol-evidence = { path = "../chaoscontrol-evidence" }
chaoscontrol-fault = { path = "../chaoscontrol-fault" }
chaoscontrol-protocol = { path = "../chaoscontrol-protocol", features = ["std"] }
chaoscontrol-vmm = { path = "../chaoscontrol-vmm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "run-property-lane"
path = "src/bin/run-property-lane.rs"
