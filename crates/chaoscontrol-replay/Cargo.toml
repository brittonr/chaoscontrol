[package]
name = "chaoscontrol-replay"
version = "0.1.0"
edition = "2021"
description = "Time-travel debugging and replay for ChaosControl"
license = "AGPL-3.0-or-later"

[dependencies]
chaoscontrol-vmm = { path = "../chaoscontrol-vmm" }
chaoscontrol-fault = { path = "../chaoscontrol-fault" }
chaoscontrol-protocol = { path = "../chaoscontrol-protocol" }
# Snapshot references remain neutral; this crate owns the bounded store shell.
chaoscontrol-replay-evidence-core = { path = "../chaoscontrol-replay-evidence-core" }
ciborium = "0.2"
zstd = "0.14"
sha2 = "0.10"
libc = "0.2"
log = "0.4"
snafu = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
tempfile = "3"
regex = "1"

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"

[[bin]]
name = "chaoscontrol-replay"
path = "src/bin/chaoscontrol-replay.rs"

