[package]
name = "chaoscontrol-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Guest-side SDK for ChaosControl deterministic simulation testing"

[[bin]]
name = "chaoscontrol-guest-supervisor"
path = "src/bin/chaoscontrol-guest-supervisor.rs"
required-features = ["full"]

[features]
default = ["full"]
full = ["dep:libc", "dep:rand", "dep:serde_json", "dep:linkme", "chaoscontrol-protocol/std"]

[dependencies]
chaoscontrol-protocol = { path = "../chaoscontrol-protocol" }
libc = { version = "0.2", optional = true }
linkme = { version = "0.3", optional = true }
rand = { version = "0.8", optional = true }
serde_json = { version = "1.0", optional = true }
