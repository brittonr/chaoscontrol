[package]
name = "chaoscontrol-trace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
description = "eBPF-based KVM tracing harness for ChaosControl deterministic VMM"

[dependencies]
anyhow = "1"
libbpf-rs = "0.26"
snafu = "0.8"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
blake3 = "1.8"

[build-dependencies]
blake3 = "1.8"
libbpf-cargo = "0.26"

[dev-dependencies]
kvm-bindings = "0.10"
kvm-ioctls = "0.19"
vm-memory = { version = "0.17", features = ["backend-mmap"] }

[[bin]]
name = "chaoscontrol-trace"
path = "src/bin/chaoscontrol-trace.rs"
