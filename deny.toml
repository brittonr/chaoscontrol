# Cargo dependency policy for deterministic Nix-backed checks.
# Keep vulnerability semantics in the dedicated cargo-audit rail; this file
# focuses cargo-deny on graph hygiene, license policy, and source provenance.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = true

[output]
feature-depth = 1

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[[licenses.exceptions]]
crate = "libbpf-cargo"
allow = ["LGPL-2.1-only"]

[[licenses.exceptions]]
crate = "libbpf-rs"
allow = ["LGPL-2.1-only"]

[bans]
multiple-versions = "allow"
# Workspace-local path dependencies appear as wildcard requirements to
# cargo-deny; keep version-policy enforcement out of this provenance rail.
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
