# Cargo dependency policy for deterministic Nix-backed checks.
# Keep vulnerability semantics in the dedicated cargo-audit rail; this file
# focuses cargo-deny on graph hygiene, license policy, and source provenance.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = true

[output]
feature-depth = 1

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

# Every repository-owned package uses AGPL. Keep these exceptions explicit so
# unrelated third-party AGPL dependencies still require review.
[[licenses.exceptions]]
crate = "chaoscontrol-dashboard"
allow = ["AGPL-3.0-or-later"]

